<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>アプリの接続を修復｜SeeDonext</title><link rel="stylesheet" href="../landing.css"></head>
<body><main class="document wrap"><h1>アプリの接続を修復</h1>
<p>オンラインで、SeeDonextのオフライン用プログラムだけを更新します。タスク・メモ・バックアップやサイトデータの削除は行いません。</p>
<p>ほかのタブで編集中の場合は、先に入力を保存してください。更新後はそのタブも保存してから再読み込みしてください。</p>
<button id="repairWorker" class="button" type="button">プログラムを更新する</button>
<p id="repairStatus" role="status">通信できる状態で実行してください。</p>
<p><a href="../app/">アプリを開く</a> · <a href="../">紹介ページへ戻る</a></p>
<script>
(() => {
  const button = document.getElementById("repairWorker");
  const status = document.getElementById("repairStatus");
  button.addEventListener("click", async () => {
    button.disabled = true;
    status.dataset.state = "working";
    status.textContent = "オフライン用プログラムを更新しています…";
    let registration, onUpdateFound;
    try {
      if (!window.isSecureContext || !("serviceWorker" in navigator)) throw new Error("対応ブラウザーのHTTPS接続が必要です。");
      const scope = new URL("../app/", location.href);
      registration = await navigator.serviceWorker.getRegistration(scope.href);
      if (registration && registration.scope !== scope.href) throw new Error("想定外の登録範囲です。サイト管理者へお知らせください。");
      if (!registration) registration = await navigator.serviceWorker.register(new URL("sw.js", scope), { scope: scope.href, updateViaCache: "none" });
      let expectedWorker = registration.waiting || registration.installing;
      onUpdateFound = () => { expectedWorker = registration.installing || expectedWorker; };
      registration.addEventListener("updatefound", onUpdateFound);
      await registration.update();
      const deadline = Date.now() + 30000;
      while (true) {
        const worker = registration.waiting || registration.installing;
        if (expectedWorker?.state === "redundant" || worker?.state === "redundant") throw new Error("プログラムを取得できませんでした。");
        if (worker?.state === "installed") worker.postMessage({ type: "ACTIVATE_UPDATE" });
        if (!worker && registration.active?.state === "activated") {
          if (expectedWorker && registration.active !== expectedWorker) throw new Error("Worker update failed; please retry online.");
          break;
        }
        if (Date.now() > deadline) throw new Error("更新に時間がかかっています。通信を確認して再実行してください。");
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      status.dataset.state = "ready";
      status.textContent = "更新が完了しました。「アプリを開く」から確認してください。タスクデータは変更していません。";
    } catch (error) {
      status.dataset.state = "error";
      status.textContent = "更新できませんでした。タスクデータは削除していません。" + error.message;
    } finally {
      if (registration && onUpdateFound) registration.removeEventListener("updatefound", onUpdateFound);
      button.disabled = false;
    }
  });
})();
</script></main></body></html>
